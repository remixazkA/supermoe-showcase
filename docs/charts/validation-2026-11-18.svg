chor="end" class="lb2">full panel (up to 12), model grouping</text><g><title>C: 32 correct, 8 wrong, 5 abstained; 420 GPU-s per question</title><rect x="250" y="168" width="248.8888888888889" height="18" class="f1"/><rect x="500.8888888888889" y="168" width="60.22222222222223" height="18" class="f2"/><path d="M563.1111111111111,168h32.888888888888914a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-32.888888888888914z" class="fn"/></g><text x="608" y="181" class="val">32</text><text x="740" y="181" text-anchor="end" class="val">420</text><text x="238" y="211" text-anchor="end" class="lb"><tspan font-weight="600">D</tspan></text><text x="238" y="225" text-anchor="end" class="lb2">3 voices, rule-based grouping</text><g><title>D: 32 correct, 3 wrong, 10 abstained; 51 GPU-s per question</title><rect x="250" y="202" width="248.8888888888889" height="18" class="f1"/><rect x="500.8888888888889" y="202" width="21.333333333333314" height="18" class="f2"/><path d="M524.2222222222222,202h71.77777777777777a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-71.77777777777777z" class="fn"/></g><text x="608" y="215" class="val">32</text><text x="740" y="215" text-anchor="end" class="val">51</text><text x="238" y="245" text-anchor="end" class="lb"><tspan font-weight="600">B-vote</tspan></text><text x="238" y="259" text-anchor="end" class="lb2">3 voices, vote (exploratory)</text><g><title>B-vote: 45 correct, 0 wrong, 0 abstained; about 54 GPU-s per question</title><path d="M250,236h346a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-346z" class="f1"/></g><text x="608" y="249" class="val">45</text><text x="740" y="249" text-anchor="end" class="val">≈54</text><text x="238" y="279" text-anchor="end" class="lb"><tspan font-weight="600">C-vote</tspan></text><text x="238" y="293" text-anchor="end" class="lb2">full panel, vote (exploratory)</text><g><title>C-vote: 45 correct, 0 wrong, 0 abstained; about 360 GPU-s per question</title><path d="M250,270h346a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-346z" class="f1"/></g><text x="608" y="283" class="val">45</text><text x="740" y="283" text-anchor="end" class="val">≈360</text><text x="24" y="358" class="ax">Number after each bar: correct answers. The vote arms were exploratory (not pre-registered); their GPU-s exclude the grouping turn.</text>
<text x="24" y="374" class="ax">With the trap-phrase check reviewed by hand (labels only): A 45 correct, B 35, C 36 with 4 wrong, D 35; the vote arms are unchanged.</text>
