<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388" viewBox="0 0 760 388" role="img" aria-labelledby="t d">
<title id="t">Verifying claims: one reviewer vs. panels</title><desc id="d">Stacked bars of correct, wrong and abstained answers out of 45 per arm. A: 43 correct, 2 wrong, 0 abstained, 23 GPU-s per question; B: 31 correct, 4 wrong, 10 abstained, 67 GPU-s per question; C: 32 correct, 8 wrong, 5 abstained, 420 GPU-s per question; D: 32 correct, 3 wrong, 10 abstained, 51 GPU-s per question; B-vote: 45 correct, 0 wrong, 0 abstained, 54 GPU-s per question; C-vote: 45 correct, 0 wrong, 0 abstained, 360 GPU-s per question.</desc>
<style>
