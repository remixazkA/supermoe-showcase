<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t d">
<title id="t">Seeded errors found vs. GPU time per round</title><desc id="d">Scatter of six review arms. A: 20 of 28 found at 56 GPU-seconds per round; 1→3 policy: 20 of 28 found at 56 GPU-seconds per round; B: 13 of 28 found at 71 GPU-seconds per round; B-vote: 24 of 28 found at 71 GPU-seconds per round; C: 19 of 28 found at 502 GPU-seconds per round; C-vote: 25 of 28 found at 502 GPU-seconds per round.</desc>
<style>
