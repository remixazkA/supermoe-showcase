<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="t d">
<title id="t">False alarms on untouched code</title><desc id="d">Bar chart of false alarms in 8 control rounds per arm. A: 0; 1→3 policy: 1; B: 1; B-vote: 1 plus 1 dubious; C: 3; C-vote: 5.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neutral:#c3c2b7;--q0:#f0efec;--q1:#9ec5f4;--q2:#256abf;--q0t:#52514e;--q1t:#0b0b0b;--q2t:#ffffff}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--neutral:#5c5b56;--q0:#2c2c2a;--q1:#1c5cab;--q2:#6da7ec;--q0t:#c3c2b7;--q1t:#ffffff;--q2t:#0b0b0b}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.t{font-size:16px;font-weight:600}.st{font-size:12px;fill:var(--ink2)}.ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.lb{font-size:12px}.lb2{font-size:11px;fill:var(--ink2)}.val{font-size:12px;font-variant-numeric:tabular-nums}
.grid{stroke:var(--grid);stroke-width:1}.base{stroke:var(--axis);stroke-width:1}
.f1{fill:var(--s1)}.f2{fill:var(--s2)}.f3{fill:var(--s3)}.fn{fill:var(--neutral)}.ring{stroke:var(--surface);stroke-width:2}
.q0{fill:var(--q0)}.q1{fill:var(--q1)}.q2{fill:var(--q2)}.q0t{fill:var(--q0t)}.q1t{fill:var(--q1t)}.q2t{fill:var(--q2t)}
</style>
<rect width="760" height="370" rx="8" fill="var(--surface)"/>
<text x="24" y="34" class="t">False alarms on untouched code</text>
<text x="24" y="54" class="st">Control rounds (code with nothing planted) where the arm reported a defect that review found not real · 8 control rounds</text>
<rect x="24" y="71" width="10" height="10" rx="2" class="f1"/><text x="39" y="80" class="lb2">One reviewer</text><rect x="136.6" y="71" width="10" height="10" rx="2" class="f2"/><text x="151.6" y="80" class="lb2">Accepted-group rule</text><rect x="293.29999999999995" y="71" width="10" height="10" rx="2" class="f3"/><text x="308.29999999999995" y="80" class="lb2">Vote on verdicts</text><line x1="250" x2="250" y1="94" y2="296" class="base"/><text x="250" y="312" text-anchor="middle" class="ax">0</text><line x1="347.5" x2="347.5" y1="94" y2="296" class="grid"/><text x="347.5" y="312" text-anchor="middle" class="ax">2</text><line x1="445" x2="445" y1="94" y2="296" class="grid"/><text x="445" y="312" text-anchor="middle" class="ax">4</text><line x1="542.5" x2="542.5" y1="94" y2="296" class="grid"/><text x="542.5" y="312" text-anchor="middle" class="ax">6</text><line x1="640" x2="640" y1="94" y2="296" class="grid"/><text x="640" y="312" text-anchor="middle" class="ax">8</text><text x="445" y="332" text-anchor="middle" class="ax">Control rounds with a false alarm (of 8)</text>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--surface)"/><rect width="2.5" height="6" fill="var(--s3)"/></pattern></defs><text x="238" y="109" text-anchor="end" class="lb"><tspan font-weight="600">A</tspan></text><text x="238" y="123" text-anchor="end" class="lb2">one reviewer</text><g><title>A: 0 false alarm(s) in 8 control rounds</title><line x1="250" x2="250" y1="100" y2="118" stroke="var(--ink2)" stroke-width="2"/></g><text x="258" y="113" class="val">0</text><text x="238" y="143" text-anchor="end" class="lb"><tspan font-weight="600">1→3 policy</tspan></text><text x="238" y="157" text-anchor="end" class="lb2">one reviewer, escalates to 3 on doubt</text><g><title>1→3 policy: 1 false alarm(s) in 8 control rounds</title><path d="M250,134h44.75a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-44.75z" class="f1"/></g><text x="306.75" y="147" class="val">1</text><text x="238" y="177" text-anchor="end" class="lb"><tspan font-weight="600">B</tspan></text><text x="238" y="191" text-anchor="end" class="lb2">3 voices, accepted-group rule</text><g><title>B: 1 false alarm(s) in 8 control rounds</title><path d="M250,168h44.75a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-44.75z" class="f2"/></g><text x="306.75" y="181" class="val">1</text><text x="238" y="211" text-anchor="end" class="lb"><tspan font-weight="600">B-vote</tspan></text><text x="238" y="225" text-anchor="end" class="lb2">3 voices, vote on verdicts</text><g><title>B-vote: 1 false alarm(s), 1 dubious in 8 control rounds</title><rect x="250" y="202" width="48.75" height="18" class="f3"/><path d="M300.75,202h42.75a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-42.75z" fill="url(#hatch)"/></g><text x="355.5" y="215" class="val">1 + 1 dubious (hatched)</text><text x="238" y="245" text-anchor="end" class="lb"><tspan font-weight="600">C</tspan></text><text x="238" y="259" text-anchor="end" class="lb2">full panel, accepted-group rule</text><g><title>C: 3 false alarm(s) in 8 control rounds</title><path d="M250,236h142.25a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-142.25z" class="f2"/></g><text x="404.25" y="249" class="val">3</text><text x="238" y="279" text-anchor="end" class="lb"><tspan font-weight="600">C-vote</tspan></text><text x="238" y="293" text-anchor="end" class="lb2">full panel, vote on verdicts</text><g><title>C-vote: 5 false alarm(s) in 8 control rounds</title><path d="M250,270h239.75a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-239.75z" class="f3"/></g><text x="501.75" y="283" class="val">5</text>
</svg>
